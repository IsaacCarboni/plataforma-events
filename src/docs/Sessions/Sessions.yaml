paths:
  /api/sessions/register:
    post:
      summary: Registro de nuevo usuario
      tags:
        - Sessions
      description: Endpoint público para registrar un usuario. El rol se asigna por defecto como "user".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserInput'
      responses:
        '201':
          description: Usuario creado exitosamente.
        '400':
          description: Datos faltantes o correo electrónico ya registrado.

  /api/sessions/login:
    post:
      summary: Inicio de sesión de usuario
      tags:
        - Sessions
      description: Autentica al usuario y genera una cookie HTTP-Only con el token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserInput'
      responses:
        '200':
          description: Sesión iniciada correctamente. La cookie 'currentUser' es inyectada en la respuesta.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: currentUser=eyJhbGciOi...; Path=/; HttpOnly; Secure
        '401':
          description: Credenciales inválidas.

  /api/sessions/current:
    get:
      summary: Obtener perfil del usuario autenticado
      tags:
        - Sessions
      description: Devuelve la información del usuario en sesión activa a partir de la cookie JWT.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Datos del usuario autenticado.
        '401':
          description: No hay una sesión activa o el token expiró.

  /api/sessions/logout:
    post:
      summary: Cerrar sesión
      tags:
        - Sessions
      description: Limpia la cookie 'currentUser' del navegador.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sesión cerrada correctamente.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: currentUser

  schemas:
    RegisterUserInput:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
      properties:
        first_name:
          type: string
          example: Isaac
        last_name:
          type: string
          example: Carboni
        email:
          type: string
          format: email
          example: isaac@test.com
        password:
          type: string
          format: password
          example: Password123!
        age:
          type: integer
          example: 31

    LoginUserInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: isaac@test.com
        password:
          type: string
          format: password
          example: Password123!