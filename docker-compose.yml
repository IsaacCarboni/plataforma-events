version: '3.8'

services:
  app:
    build: .
    container_name: plataforma-events-app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb+srv://tu_usuario:tu_password@cluster... (pegá tu URI real de Atlas acá)
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    container_name: plataforma-events-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data: