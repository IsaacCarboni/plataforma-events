version: '3.8'

services:
  app:
    build: .
    container_name: plataforma-events-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    container_name: plataforma-events-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data: